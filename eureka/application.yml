# src/GIT REPO /resources/application.yml
server:
  port: 8761
  shutdown: graceful

spring:
  application:
    name: eureka
  security:
    user:
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASS:eureka}
      roles: ADMIN
    oauth2:
      registration:
        keycloak:
          client-id: eureka-ui
          client-secret: rmi3U6PaTQvbcre9POxV78hRZfJ5vPsD
          scope: openid,profile
          authorization-grant-type: authorization_code
          redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      provider:
        keycloak:
          issuer-uri: https://localhost:8081/realms/teamnest-demo


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,refresh
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, ping, diskSpace
        liveness:
          include: livenessState, ping
  observations:
    key-values:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  prometheus:
    metrics:
      export:
        enabled: true

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    # When clustering in Docker, set via env EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:${EUREKA_PASS:changeme}@localhost:8761/eureka/}
  server:
    eviction-interval-timer-in-ms: 60000
    renewal-percent-threshold: 0.85
  instance:
    hostname: ${EUREKA_HOST:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    metadata-map:
      zone: ${ZONE:primary}
      version: 1.0.0

logging:
  level:
    com.netflix: WARN
    org.springframework.cloud: INFO

---
spring:
  config:
    activate:
      on-profile: docker

server:
  tomcat:
    max-http-form-post-size: 10MB

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    hostname: ${EUREKA_HOST:${HOSTNAME:localhost}}
